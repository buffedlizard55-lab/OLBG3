name: Verify and publish dashboard
on:
  push:
    # every session branch runs the same build so a red check is caught before the PR
    branches: [main, 'arena/**']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write is needed only so scheduled/manual runs on main can commit the regenerated
    # board (see the commit step below). Every run on main commits its regenerated output after the checks pass.
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Advance publication time (not source verification)
        run: python scripts/publication_clock.py
      # Re-certify the official-clock evidence BEFORE anything is graded. `scripts/live_refresh.py`
      # rewrites data/verifications.json and data/release_checks.json from the newest committed
      # capture + probe; model.py and tools/originate.py then read those records when they decide
      # whether a pick may still be HIGH. Running this after them (the order used until 2026-10-26)
      # made every scheduled run grade against yesterday's release evidence and then fail
      # check_board.py with "HIGH stored release differs from current evidence" / "HIGH lacks a
      # current official-start release" on each expired fixture. One ordered pass now produces the
      # same bytes the old two-cycle workaround produced, and a stale board demotes to analysis
      # instead of turning the publication job red (FL-232).
      - name: Re-certify official-clock evidence
        run: python scripts/live_refresh.py
      - run: python scripts/update.py
      # Public robots-aware OLBG discovery (partial by design; failures stay labelled unverified)
      - run: python scripts/discovery.py
      - run: python scripts/build.py
      # Outright / race markets (Golf, Motor Racing, Greyhounds, Rugby League, Gaelic championship):
      # priced from the captured OLBG listings with a disclosed field-size prior.
      - run: python scripts/build_gap_sports.py
      - run: python scripts/model.py
      # OLBG lines track (/olbg): the 06:50Z harvest (189 rows incl. rows carried for sports not
      # re-listed) with per-row source URLs, our own shrink+home-edge model, sourced HIGH predictions
      # and the shared flag register (data/flagged.json).
      - name: Rebuild the OLBG lines track
        run: |
          # The official-clock re-certification already happened in its own earlier step; this
          # block extracts the newest committed capture only. Both are deterministic: a re-run of
          # the same capture rewrites byte-identical files, which keeps the commit step stable.
          python3 tools/build_dataset.py
          python3 tools/originate.py
          # Accounting/rendering must follow BOTH tracks' repricing and release expiry.
          python3 scripts/brief_coverage.py
          python3 scripts/build_site.py
          python3 scripts/check_board.py
          python3 tools/build_site.py
          python3 tools/check_site.py
      - name: Publish the OLBG lines track inside the shared artifact
        run: |
          mkdir -p site/olbg
          cp -r olbg-board/. site/olbg/
          ls site/olbg
      - name: Refresh the root snapshot (the legacy Pages publisher serves the repo root)
        run: |
          python scripts/build_site.py --snapshot
          git status --porcelain | head -40
          if [ -n "$(git status --porcelain -- index.html predictions.html verification.html flagged.html method.html sports assets style.css data.json '*.html' .nojekyll)" ]; then
            echo "::warning::Root snapshot differs from the committed copy; run scripts/build_site.py --snapshot and commit."
          fi
      # Unit tests run AFTER the rebuild: several pins compare committed accounting with a fresh recompute,
      # and the board is regenerated on every run, so running them first would fail on any hourly change.
      - name: Unit tests (after the rebuild)
        run: python -m unittest discover -s tests -v
      - run: python scripts/check.py
      - run: python scripts/check_links.py
      # Every run on main commits its regenerated board, whatever triggered it. The board reads the wall clock
      # (kick-off status, release gate), so a rebuild a few minutes after the last commit legitimately differs; a
      # hard "stale" gate therefore turned ordinary merge pushes red without anything being wrong with the site.
      # Committing here, only after every check above has passed, keeps one rule instead of two: main always
      # carries exactly the bytes that were checked and deployed, and the legacy branch publisher serves them.
      - name: Commit the regenerated board (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Regenerated board is identical to main; nothing to commit."
          else
            git status --porcelain | head -40
            git commit -m "Board refresh after checks passed (${{ github.event_name }} run)"
            git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
            echo "Committed and pushed the regenerated board."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: data/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || 'https://buffedlizard55-lab.github.io/OLBG3/' }}
    steps:
      # This repository's Pages site is configured with build_type "legacy" (branch: main, path: /),
      # so the branch publisher already serves the committed root — that is what put the 2026-10-23
      # board live. actions/deploy-pages can only work when the site is configured for Actions, so it
      # is attempted but must not turn the build red when the branch publisher is doing the publish.
      # The smoke tests below are the real check: they assert the live routes serve content.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Note which publisher served the site
        run: |
          echo "Branch publisher: https://buffedlizard55-lab.github.io/OLBG3/ (build_type legacy)."
          echo "deploy-pages outcome: ${{ steps.deployment.outcome }}"
          echo "If it failed, the legacy builder published the committed root instead — the smoke tests confirm it."
      - name: Smoke-test the OLBG lines pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url || 'https://buffedlizard55-lab.github.io/OLBG3' }}
        run: |
          python - <<'PYTEST'
          import os, urllib.request
          base = os.environ['SITE_URL'].rstrip('/') + '/olbg/'
          for name in ['index.html', 'picks.html', 'predictions.html', 'matches.html',
                       'methodology.html', 'flagged.html', 'sports/cricket.html',
                       'sports/tennis.html', 'assets/style.css']:
              with urllib.request.urlopen(base + name, timeout=40) as r:
                  assert r.status == 200 and r.read(), name
          print('Published OLBG lines routes: PASS')
          PYTEST
      - name: Smoke-test published pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url || 'https://buffedlizard55-lab.github.io/OLBG3' }}
        run: |
          python - <<'PYTEST'
          import json, os, urllib.request
          base=os.environ['SITE_URL'].rstrip('/')+'/'
          for name in ['index.html','predictions.html','verification.html','flagged.html','feed-overview.html','matches.html','basketball.html','ice-hockey.html','baseball.html','coverage.html','markets.html','review.html','style.css','data.json']:
              with urllib.request.urlopen(base+name,timeout=40) as response:
                  content=response.read()
                  assert response.status==200 and content, name
                  if name=='data.json':
                      data=json.loads(content)
                      assert data['generated'] and isinstance(data['matches'],list)
          print('Published routes and data: PASS')
          PYTEST
