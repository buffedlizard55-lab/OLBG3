name: Verify and publish dashboard
on:
  push:
    branches: [main, arena/90bbe96f-olbg3]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - run: python scripts/check.py
      - name: Save verified integration snapshot for existing legacy Pages
        if: github.ref == 'refs/heads/arena/90bbe96f-olbg3'
        run: |
          cp site/*.html site/*.css site/data.json .
          touch .nojekyll
          git config user.name "OLBG source updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '*.css' data.json data/current.json .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "data: publish official-source integration snapshot"
            git pull --rebase origin arena/90bbe96f-olbg3
            git push origin arena/90bbe96f-olbg3
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: data/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
