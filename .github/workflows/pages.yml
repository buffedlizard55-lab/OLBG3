name: Verify and publish dashboard
on:
  push:
    # every session branch runs the same build so a red check is caught before the PR
    branches: [main, 'arena/**']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write is needed only so scheduled/manual runs on main can commit the regenerated
    # board (see the commit step below). Push runs keep the stale-output gate and never commit.
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update.py
      # Public robots-aware OLBG discovery (partial by design; failures stay labelled unverified)
      - run: python scripts/discovery.py
      - run: python scripts/build.py
      # Outright / race markets (Golf, Motor Racing, Greyhounds, Rugby League, Gaelic championship):
      # priced from the captured OLBG listings with a disclosed field-size prior.
      - run: python scripts/build_gap_sports.py
      - run: python scripts/model.py
      # Brief-coverage accounting: per-sport counts against the brief's five-picks-per-sport target,
      # recomputed from the rows above. check_board.py fails if the committed file is stale.
      - run: python scripts/brief_coverage.py
      # Board track: originated lines, picks, predictions, verification, audit + flagged pages.
      # Runs after build.py so it can own the landing page and the shared navigation.
      - run: python scripts/build_site.py
      # Board invariants: every row needs an OLBG source link, verification must be all-or-nothing,
      # prices must recompute, and every HIGH-confidence pick must carry a 30+ word sourced prediction.
      - run: python scripts/check_board.py
      # OLBG lines track (/olbg): the 06:50Z harvest (189 rows incl. rows carried for sports not
      # re-listed) with per-row source URLs, our own shrink+home-edge model, sourced HIGH predictions
      # and the shared flag register (data/flagged.json).
      - name: Rebuild the OLBG lines track
        run: |
          python3 tools/build_dataset.py
          python3 tools/originate.py
          python3 tools/build_site.py
          python3 tools/check_site.py
      - name: Publish the OLBG lines track inside the shared artifact
        run: |
          mkdir -p site/olbg
          cp -r olbg-board/. site/olbg/
          ls site/olbg
      - name: Refresh the root snapshot (the legacy Pages publisher serves the repo root)
        run: |
          python scripts/build_site.py --snapshot
          git status --porcelain | head -40
          if [ -n "$(git status --porcelain -- index.html predictions.html verification.html flagged.html method.html sports assets style.css data.json '*.html' .nojekyll)" ]; then
            echo "::warning::Root snapshot differs from the committed copy; run scripts/build_site.py --snapshot and commit."
          fi
      # Unit tests run AFTER the rebuild: several pins compare committed accounting with a fresh recompute,
      # and the board is regenerated on every run, so running them first would fail on any hourly change.
      - name: Unit tests (after the rebuild)
        run: python -m unittest discover -s tests -v
      - name: Fail if the committed OLBG track is stale (push events)
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain olbg-board data/matches.json data/lines.json data/predictions-olbg.json data/flagged.json data/raw data/verifications.json data/meta.json data/excluded.json data/gap_sports.json olbg)" ]; then
            echo "::error::OLBG lines track is out of date. Run the build scripts and commit."
            git --no-pager diff --stat olbg-board data
            exit 1
          fi
      - run: python scripts/check.py
      - run: python scripts/check_links.py
      # Scheduled/manual runs on main: the board reads the wall clock (kick-off status, release gate), so every
      # hourly rebuild legitimately differs from the last commit. Commit the regenerated output only AFTER every
      # check above has passed, so main always carries exactly the bytes that were checked and deployed.
      - name: Commit the regenerated board (scheduled or manual runs on main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Regenerated board is identical to main; nothing to commit."
          else
            git commit -m "Hourly board refresh (automated, after all checks passed)"
            git push origin HEAD:main
            echo "Committed and pushed the regenerated board."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: data/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Smoke-test the OLBG lines pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYTEST'
          import os, urllib.request
          base = os.environ['SITE_URL'].rstrip('/') + '/olbg/'
          for name in ['index.html', 'picks.html', 'predictions.html', 'matches.html',
                       'methodology.html', 'flagged.html', 'sports/cricket.html',
                       'sports/tennis.html', 'assets/style.css']:
              with urllib.request.urlopen(base + name, timeout=40) as r:
                  assert r.status == 200 and r.read(), name
          print('Published OLBG lines routes: PASS')
          PYTEST
      - name: Smoke-test published pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYTEST'
          import json, os, urllib.request
          base=os.environ['SITE_URL'].rstrip('/')+'/'
          for name in ['index.html','predictions.html','verification.html','flagged.html','feed-overview.html','matches.html','basketball.html','ice-hockey.html','baseball.html','coverage.html','markets.html','review.html','style.css','data.json']:
              with urllib.request.urlopen(base+name,timeout=40) as response:
                  content=response.read()
                  assert response.status==200 and content, name
                  if name=='data.json':
                      data=json.loads(content)
                      assert data['generated'] and isinstance(data['matches'],list)
          print('Published routes and data: PASS')
          PYTEST
