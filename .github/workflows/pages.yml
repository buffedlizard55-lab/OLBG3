name: Verify and publish dashboard
on:
  push:
    branches: [main, arena/90bbe96f-olbg3]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      # Board track: originated lines, picks, predictions, verification + flagged pages.
      # Runs after build.py so it can own the landing page and the shared navigation.
      - run: python scripts/build_site.py
      - run: python scripts/check.py
      - run: python scripts/check_links.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: data/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Smoke-test published pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYTEST'
          import json, os, urllib.request
          base=os.environ['SITE_URL'].rstrip('/')+'/'
          for name in ['index.html','predictions.html','verification.html','flagged.html','feed-overview.html','matches.html','basketball.html','ice-hockey.html','baseball.html','coverage.html','markets.html','review.html','style.css','data.json']:
              with urllib.request.urlopen(base+name,timeout=40) as response:
                  content=response.read()
                  assert response.status==200 and content, name
                  if name=='data.json':
                      data=json.loads(content)
                      assert data['generated'] and isinstance(data['matches'],list)
          print('Published routes and data: PASS')
          PYTEST
