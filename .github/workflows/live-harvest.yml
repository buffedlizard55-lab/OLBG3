name: Live OLBG listing capture

# The agent sandbox that maintains this repo has no outbound route to olbg.com (FL-077), so the
# bounded, robots-aware read of the public listings happens on a runner that does. The served
# bytes are committed back as evidence so the extraction step can be reviewed line by line.
#
# Trigger: a push that changes .harvest/request.json. This keeps the capture on demand without
# needing actions:write, and means every capture is tied to a commit that states what was asked.

on:
  push:
    paths:
      - '.harvest/request.json'

permissions:
  contents: write

concurrency:
  group: live-harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the request
        id: request
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          req = json.load(open('.harvest/request.json'))
          print(f"out={req['out']}")
          print(f"pages={req.get('pages', 'all')}")
          PY
      - name: Capture listings
        run: |
          python scripts/live_harvest.py \
            --out "${{ steps.request.outputs.out }}" \
            --delay "${{ vars.HARVEST_DELAY || 3 }}"
      - name: Show capture summary
        run: |
          python - <<'PY'
          import glob, json
          for path in sorted(glob.glob('${{ steps.request.outputs.out }}/manifest.json')):
              doc = json.load(open(path))
              print('robots:', doc['robots'].get('status'), doc['robots'].get('sha256'))
              for page in doc['pages']:
                  print(f"{page['sport']:<15} {page['path']:<38} {page.get('outcome')} "
                        f"{page.get('status', '')} {page.get('bytes', '')}")
          PY
      - name: Commit the capture
        run: |
          git config user.name  'OLBG3 live harvest'
          git config user.email 'actions@users.noreply.github.com'
          git add "${{ steps.request.outputs.out }}"
          if git diff --cached --quiet; then
            echo 'nothing new to commit'
            exit 0
          fi
          git commit -m "data(harvest): verbatim OLBG listing capture $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
