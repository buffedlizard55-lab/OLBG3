name: Live OLBG listing capture

# The agent sandbox has no outbound route to olbg.com (FL-077). This workflow performs the
# bounded, robots-aware capture on a runner that does, and commits the served bytes as evidence
# so the extraction step can be reviewed line by line.

on:
  workflow_dispatch:
    inputs:
      out:
        description: 'Output directory under data/raw'
        required: false
        default: 'data/raw/live'
      commit:
        description: 'Commit the capture to the current branch'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: live-harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture listings
        run: python scripts/live_harvest.py --out "${{ inputs.out }}"
      - name: Show capture summary
        run: |
          python - <<'PY'
          import json, glob
          for path in sorted(glob.glob('${{ inputs.out }}/manifest.json')):
              doc = json.load(open(path))
              print('robots:', doc['robots'].get('status'), doc['robots'].get('sha256'))
              for page in doc['pages']:
                  print(f"{page['sport']:<15} {page['path']:<38} {page.get('outcome')} "
                        f"{page.get('status','')} {page.get('bytes','')}")
          PY
      - name: Commit the capture
        if: inputs.commit
        run: |
          git config user.name  'OLBG3 live harvest'
          git config user.email 'actions@users.noreply.github.com'
          git add "${{ inputs.out }}"
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "data(harvest): verbatim OLBG listing capture ${{ inputs.out }}"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi
