name: Live OLBG listing capture

# The agent sandbox that maintains this repo has no outbound route to olbg.com or to the
# governing bodies (recorded as FL-077), so the bounded, robots-aware read of the public
# listings and the official-source probe happen on a runner that does. Everything fetched is
# committed back as evidence so the extraction and verification steps can be reviewed line by line.
#
# Triggers: a scoped branch request (a push changing .harvest/request.json), a daily scheduled
# refresh on main, or a manual workflow dispatch. Every response is committed verbatim before
# the separate Pages workflow is allowed to promote it.

on:
  push:
    branches: ['arena/**']
    paths:
      - '.harvest/request.json'
  # One bounded daily refresh. The scheduled run writes to main; the normal Pages workflow then
  # promotes a non-empty capture and rebuilds both boards before publishing.
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import json
          import os
          if os.environ['EVENT_NAME'] == 'push':
              req = json.load(open('.harvest/request.json'))
          else:
              now = dt.datetime.now(dt.timezone.utc)
              stamp = now.strftime('%Y%m%dT%H%MZ')
              req = {
                  'out': f'data/raw/live-{stamp}-scheduled',
                  'capture': True,
                  'probe': True,
                  'cited': True,
              }
          print(f"out={req['out']}")
          print(f"capture={'true' if req.get('capture', True) else 'false'}")
          print(f"probe={'true' if req.get('probe', True) else 'false'}")
          print(f"cited={'true' if req.get('cited', False) else 'false'}")
          PY
      - name: Capture listings
        if: steps.request.outputs.capture == 'true'
        run: |
          OUT='${{ steps.request.outputs.out }}'
          mkdir -p "$OUT"
          set +e
          python scripts/live_harvest.py --out "$OUT" --delay 3 > "$OUT/run.log" 2>&1
          echo "exit=$?" >> "$OUT/run.log"
          cat "$OUT/run.log"
      - name: Probe official competition sources
        if: steps.request.outputs.probe == 'true'
        run: |
          STAMP="$(date -u +%Y%m%dT%H%MZ)"
          OUT="data/raw/official-$STAMP"
          mkdir -p "$OUT"
          echo "out=$OUT" >> "$GITHUB_ENV"
          set +e
          python scripts/official_probe.py --out "$OUT" --delay 2 > "$OUT/run.log" 2>&1
          echo "exit=$?" >> "$OUT/run.log"
          cat "$OUT/run.log"
      - name: Re-read the official pages this repo cites
        if: steps.request.outputs.cited == 'true'
        run: |
          STAMP="$(date -u +%Y%m%dT%H%MZ)"
          OUT="data/raw/cited-$STAMP"
          mkdir -p "$OUT"
          set +e
          python scripts/probe_cited.py --out "$OUT" --delay 2 > "$OUT/run.log" 2>&1
          echo "exit=$?" >> "$OUT/run.log"
          cat "$OUT/run.log"
      - name: Show capture summary
        run: |
          python - <<'PY'
          import glob, json
          for path in sorted(glob.glob('${{ steps.request.outputs.out }}/manifest.json')):
              doc = json.load(open(path))
              print('robots:', doc['robots'].get('status'), doc['robots'].get('sha256'))
              for page in doc['pages']:
                  print(f"{page['sport']:<15} {page['path']:<38} {page.get('outcome')} "
                        f"{page.get('status', '')} {page.get('bytes', '')}")
          PY
      - name: Commit the capture
        run: |
          git config user.name  'OLBG3 live harvest'
          git config user.email 'actions@users.noreply.github.com'
          git add -A data/raw
          if git diff --cached --quiet; then
            echo 'nothing new to commit'
            exit 0
          fi
          git commit -m "data(harvest): verbatim OLBG capture and official probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
